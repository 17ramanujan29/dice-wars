  <style>
:root{--main-bg-rgb:44, 62, 80}body{background-color:rgba(var(--main-bg-rgb), 1);color:#ecf0f1;-webkit-user-select:none;user-select:none;margin:0;font-family:Inter,sans-serif;overflow:hidden}#game-container{flex-direction:column;width:100vw;height:100vh;display:flex;position:relative}#canvas-container{flex-grow:1;position:relative;overflow:hidden}canvas{cursor:pointer;width:100%;height:100%;display:block}#ui-layer{pointer-events:none;flex-direction:column;justify-content:space-between;width:100%;height:100%;display:flex;position:absolute;top:0;left:0}.ui-panel{pointer-events:auto;background:rgba(var(--main-bg-rgb), .9);border:1px solid #ffffff1a;border-radius:.5rem;margin:1rem;padding:1rem;box-shadow:0 4px 6px #0000004d}#start-screen{z-index:50;pointer-events:auto;background-color:#2c3e50f2;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;display:flex;position:absolute;top:0;left:0}#battle-modal{z-index:40;text-align:center;pointer-events:none;background:#1e2832f2;border:2px solid #f1c40f;border-radius:1rem;min-width:300px;padding:2rem;display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 10px 25px #000c}.dice-roll-anim{animation:.5s cubic-bezier(.36,.07,.19,.97) both shake}@keyframes shake{10%,90%{transform:translate(-1px)}20%,80%{transform:translate(2px)}30%,50%,70%{transform:translate(-4px)}40%,60%{transform:translate(4px)}}button{transition:all .2s}button:hover{transform:translateY(-2px);box-shadow:0 4px 8px #0003}button:active{transform:translateY(0)}
/*$vite$:1*/
</style>
</head>
<body>
<div id="game-container">
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui-layer">
        <!-- justify-between を justify-end に変更し、右側に寄せる -->
        <div class="flex justify-end items-start">
            <!-- flex-col で縦並びにし、items-end で右端を揃える -->
            <div class="flex flex-col items-end">
                <!-- margin をインラインスタイルで上書きして隙間を調整 -->
                <div id="turn-info" class="ui-panel text-xl font-bold min-w-[200px] text-center" style="margin-bottom: 0.25rem;">Waiting to start...</div>
                
                <div class="ui-panel min-w-[200px]" style="margin-top: 0.25rem;">
                    <h3 class="font-bold mb-2 border-b border-gray-500 pb-1">Players Info</h3>
                    <div id="player-stats" class="text-sm"></div>
                </div>
            </div>
        </div>
        
        <div class="flex justify-end p-4 gap-4">
            <button id="in-game-settings-btn" class="ui-panel bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-lg text-lg hidden shadow-lg border border-gray-500">設定確認</button>
            <button id="quit-game-btn" class="ui-panel bg-red-700 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg text-lg hidden shadow-lg border border-red-500">ゲーム終了</button>
            <button id="end-turn-btn" class="ui-panel bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 px-6 rounded-lg text-lg hidden shadow-lg border border-yellow-400">End Turn</button>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1 class="text-6xl font-extrabold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500 drop-shadow-lg">DICE WARS</h1>
        <p class="mb-8 text-gray-300 text-lg">Local Rules Edition</p>
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700 max-w-md w-full">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">Select Number of Players</h2>
            <div class="flex justify-center gap-4 mb-8">
                <button class="player-btn bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded w-16 h-16 text-xl" data-players="2">2</button>
                <button class="player-btn bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded w-16 h-16 text-xl" data-players="3">3</button>
                <button class="player-btn bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded w-16 h-16 text-xl" data-players="4">4</button>
            </div>
            
            <button id="open-settings-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded mb-6 border border-gray-500">
                ⚙️ ルール設定
            </button>

            
        </div>
    </div>

    <!-- Battle Modal -->
    <div id="battle-modal">
        <h2 id="battle-title" class="text-3xl font-bold mb-4 text-white">Battle!</h2>
        <div class="flex justify-between items-center gap-8">
            <div id="atk-side" class="flex flex-col items-center">
                <span class="text-xl font-bold mb-2" id="atk-player-name">Attacker</span>
                <div class="text-5xl font-bold text-red-500" id="atk-score">0</div>
                <div class="text-sm text-gray-400 mt-2">Dice: <span id="atk-dice-count">0</span></div>
            </div>
            <div class="text-3xl font-bold text-yellow-500">VS</div>
            <div id="def-side" class="flex flex-col items-center">
                <span class="text-xl font-bold mb-2" id="def-player-name">Defender</span>
                <div class="text-5xl font-bold text-blue-500" id="def-score">0</div>
                <div class="text-sm text-gray-400 mt-2">Dice: <span id="def-dice-count">0</span></div>
            </div>
        </div>
        <div id="battle-result" class="mt-6 text-2xl font-bold text-yellow-400 h-8"></div>
    </div>
</div>
<div id="settings-modal" class="hidden absolute top-0 left-0 w-full h-full bg-black bg-opacity-80 z-[60] flex items-center justify-center pointer-events-auto">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700 max-w-md w-full">
        <h2 class="text-2xl font-bold mb-6 text-center text-white">ゲーム設定</h2>
        
        <!-- ここにチェックボックスやスライダーを配置 -->
        <div class="flex items-center justify-between mb-4 p-3 bg-gray-900 rounded">
            <label for="latter-handicap-rule" class="text-white font-bold cursor-pointer">後手ボーナスダイス</label>
            <input type="checkbox" id="latter-handicap-rule" class="w-6 h-6 cursor-pointer accent-red-500 rule-toggle disabled:opacity-50 disabled:cursor-not-allowed" data-rule="latterBonusDice">
        </div>
        <!-- 大国ペナルティの設定項目 -->
        <div class="flex flex-col mb-4 p-3 bg-gray-900 rounded">
            <div class="flex items-center justify-between mb-2">
                <label for="great-power-rule" class="text-white font-bold cursor-pointer">大国ペナルティ</label>
                <input type="checkbox" id="great-power-rule" class="w-6 h-6 cursor-pointer accent-red-500 rule-toggle disabled:opacity-50 disabled:cursor-not-allowed" data-rule="greatPower">
            </div>
            <div class="flex items-center justify-between text-sm pl-2">
                <span class="text-gray-400">適用する領土数（閾値）:</span>
                <input type="number" id="great-power-threshold" class="w-16 p-1 bg-gray-700 text-white rounded border border-gray-500 text-center disabled:opacity-50 disabled:cursor-not-allowed" value="16" min="10" max="25">
            </div>
        </div>

        <!-- 小国ボーナスの設定項目 -->
        <div class="flex flex-col mb-6 p-3 bg-gray-900 rounded">
            <div class="flex items-center justify-between mb-2">
                <label for="small-country-rule" class="text-white font-bold cursor-pointer">小国ボーナス</label>
                <input type="checkbox" id="small-country-rule" class="w-6 h-6 cursor-pointer accent-blue-500 rule-toggle disabled:opacity-50 disabled:cursor-not-allowed" data-rule="smallCountryBonus">
            </div>
            <div class="flex items-center justify-between text-sm pl-2">
                <span class="text-gray-400">適用する領土数（閾値）:</span>
                <input type="number" id="small-country-threshold" class="w-16 p-1 bg-gray-700 text-white rounded border border-gray-500 text-center disabled:opacity-50 disabled:cursor-not-allowed" value="5" min="1" max="9">
            </div>
        </div>

        <button id="close-settings-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded text-lg">
            設定を閉じる
        </button>
    </div>
</div>
<!-- ゲーム終了確認モーダル -->
<div id="quit-modal" class="hidden absolute top-0 left-0 w-full h-full bg-black bg-opacity-80 z-[70] flex items-center justify-center pointer-events-auto">
    <div class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 max-w-sm w-full text-center">
        <h3 class="text-xl font-bold mb-4 text-white">ゲームを終了しますか？</h3>
        <div class="flex justify-center gap-4">
            <button id="confirm-quit-btn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-6 rounded">はい</button>
            <button id="cancel-quit-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded">いいえ</button>
        </div>
    </div>
</div>
</body>
</html>
